name: package

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ScreenTimeGuardian.sln --runtime win-x64

      - name: Publish standalone application EXE
        run: dotnet publish src/Guardian.ControlPanel/Guardian.ControlPanel.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts --no-restore /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Rename to final name
        shell: pwsh
        run: |
          $src = 'artifacts/ScreenTimeGuardian.ControlPanel.exe'
          $dst = 'artifacts/ScreenTimeGuardian.exe'
          if (Test-Path $src) {
            Copy-Item $src $dst -Force
            Remove-Item $src -Force
          }
          Write-Host "Output: $dst"

      - name: Verify output
        shell: pwsh
        run: |
          $exe = 'artifacts/ScreenTimeGuardian.exe'
          if (-not (Test-Path $exe)) {
            throw "Output EXE not found: $exe"
          }
          $size = (Get-Item $exe).Length
          Write-Host "ScreenTimeGuardian.exe size: $([math]::Round($size / 1MB, 1)) MB"
          if ($size -lt 1MB) {
            throw "EXE seems too small ($size bytes) — publish may have failed"
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeGuardian-${{ github.ref_name }}
          path: artifacts/ScreenTimeGuardian.exe
          if-no-files-found: error
