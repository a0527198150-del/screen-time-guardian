name: package

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ScreenTimeGuardian.sln --runtime win-x64

      - name: Publish standalone application EXE
        run: dotnet publish src/Guardian.ControlPanel/Guardian.ControlPanel.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts --no-restore /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Rename to final name
        shell: pwsh
        run: |
          $src = 'artifacts/ScreenTimeGuardian.ControlPanel.exe'
          $dst = 'artifacts/ScreenTimeGuardian.exe'
          if (Test-Path $src) {
            Copy-Item $src $dst -Force
            Remove-Item $src -Force
          }
          Write-Host "Output: $dst"

      - name: Verify output
        shell: pwsh
        run: |
          $exe = 'artifacts/ScreenTimeGuardian.exe'
          if (-not (Test-Path $exe)) {
            throw "Output EXE not found: $exe"
          }
          $size = (Get-Item $exe).Length
          Write-Host "ScreenTimeGuardian.exe size: $([math]::Round($size / 1MB, 1)) MB"
          if ($size -lt 1MB) {
            throw "EXE seems too small ($size bytes) — publish may have failed"
          }

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts\ScreenTimeGuardian.exe -DestinationPath artifacts\ScreenTimeGuardian.zip -Force
          if (-not (Test-Path artifacts\ScreenTimeGuardian.zip)) { throw 'ZIP package was not created' }

      - name: Upload full package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeGuardian-${{ github.ref_name }}
          path: |
            artifacts/ScreenTimeGuardian.exe
            artifacts/ScreenTimeGuardian.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Screen Time Guardian ${{ github.ref_name }}"
          body: |
            ## Screen Time Guardian ${{ github.ref_name }}

            ### התקנה
            1. הורד את `ScreenTimeGuardian.exe`
            2. לחץ לחיצה ימנית → **הפעל כמנהל**
            3. בצע את שלבי ההתקנה
            4. פתח את לוח הבקרה מהתפריט ההתחל

            ### מה חדש בגרסה זו
            - ממשק חדש לגמרי — 3 מסכים במקום 8 לשוניות
            - אשף creation לכללים ב-3 שלבים
            - תבניות פקד מותאמות אישית (אין Aero כחול בריחוף)
            - מתקין מקצועי בסגנון Google עם קיצורי דרך
            - ניווט מקלדת מלא בלוח הזמנים
            - תמיכה מלאה ב-RTL
          files: |
            artifacts/ScreenTimeGuardian.exe
            artifacts/ScreenTimeGuardian.zip
          draft: false
          prerelease: false
